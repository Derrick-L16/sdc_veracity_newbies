kind = "web"
previewPath = "/"
title = "Veracity"
description = "Explainable inventory corrections with stock counts, evidence review, approvals, and permanent Decision Passports."
version = "1.0.0"
id = "artifacts/veracity"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25773

[services.development]
run = "pnpm --filter @workspace/veracity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/veracity", "run", "build" ]
serve = "static"
publicDir = "artifacts/veracity/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25773"
BASE_PATH = "/"
